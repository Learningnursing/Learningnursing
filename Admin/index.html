<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>LearningNursing Admin</title>
<style>
/* ===== Admin styles (same palette as the public site) ===== */
:root{--navy:#0b2545;--blue:#1769aa;--blue-l:#eaf4ff;--teal:#0f8b8d;--bg:#f3f6fa;--text:#172033;--muted:#667085;--border:#e1e8f0;--danger:#b42318;--ok:#16794c;--warn:#a05a00}
*{box-sizing:border-box;margin:0;padding:0}
body{font:14px/1.5 Inter,Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{background:var(--navy);color:#fff;padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 22px;font-weight:800}
.brand i{font-style:normal;width:36px;height:36px;border-radius:10px;background:#fff;color:var(--navy);display:grid;place-items:center}
.brand small{display:block;font-weight:500;color:#9fb3c8;font-size:11px}
.nav button{display:flex;width:100%;gap:10px;align-items:center;border:0;background:none;color:#cbd7e5;padding:10px 12px;border-radius:10px;text-align:left;cursor:pointer;margin-bottom:2px}
.nav button:hover{background:rgba(255,255,255,.08)}
.nav button.on{background:var(--teal);color:#fff;font-weight:700}
.main{min-width:0}
.top{display:flex;align-items:center;gap:12px;padding:14px 26px;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
.top h1{font-size:19px;color:var(--navy);flex:1}
.burger{display:none;border:1px solid var(--border);background:#fff;border-radius:8px;padding:6px 10px}
.content{padding:26px;max-width:1100px}
.btn{border:1px solid var(--border);background:#fff;border-radius:9px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--blue)}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.pri:hover{background:#123861}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.danger{color:var(--danger)}
.dirty{background:#fff8e8;border:1px solid #f2dfad;color:#694a00;padding:3px 10px;border-radius:20px;font-size:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:22px}
.card,.box{background:#fff;border:1px solid var(--border);border-radius:14px;padding:18px}
.card b{display:block;font-size:28px;color:var(--navy)}
.card span{color:var(--muted);font-size:13px}
.box{margin-bottom:16px}.box h3{color:var(--navy);margin-bottom:12px;font-size:16px}.box h4{color:var(--navy);margin-bottom:10px;font-size:14px}
.notice{padding:14px 16px;border-radius:12px;background:var(--blue-l);border:1px solid #cfe3f7;margin-bottom:18px}
.notice.warn{background:#fff8e8;border-color:#f2dfad;color:#694a00}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.bar input,.bar select{border:1px solid var(--border);border-radius:9px;padding:8px 12px;background:#fff}
.bar input{flex:1;min-width:160px}
.lrow{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px;flex-wrap:wrap}
.lmain{flex:1;min-width:180px}.lmain small{display:block;color:var(--muted)}
.lact{display:flex;gap:6px;flex-wrap:wrap}
.lact button{border:1px solid var(--border);background:#fff;border-radius:8px;padding:4px 9px;font-size:12px;cursor:pointer}
.lact button:hover{border-color:var(--blue)}.lact .danger{color:var(--danger)}
.pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;background:#f2f4f7;color:var(--muted)}
.pill.ok{background:#e7f6ee;color:var(--ok)}
.empty{padding:30px;text-align:center;color:var(--muted);background:#fff;border:1px dashed var(--border);border-radius:12px}
.fld{display:block;margin-bottom:12px}.fld>span{display:block;font-weight:600;margin-bottom:4px;font-size:13px}
.fld small,.hint{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.fld input[type=text],.fld input:not([type]),.fld input[type=number],.fld select,.fld textarea,.imgf input{width:100%;border:1px solid var(--border);border-radius:9px;padding:9px 11px;background:#fff}
.fld textarea{resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus,.imgf input:focus{outline:2px solid #bcd9f2;border-color:var(--blue)}
.fld.chk{display:flex;gap:8px;align-items:center}.fld.chk>span{margin:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.row{display:flex;gap:10px;border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px;background:#fafcff}
.rn{width:28px;height:28px;border-radius:8px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px;flex-shrink:0}
.rb{flex:1;min-width:0}.ra{display:flex;flex-direction:column;gap:4px}
.ra button{border:1px solid var(--border);background:#fff;border-radius:6px;padding:2px 8px;cursor:pointer}
.imgf{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.imgf>label{display:none}.imgf .box2{flex:1}
.thumb{width:84px;height:64px;border-radius:10px;background:#eef3f8;border:1px solid var(--border);display:grid;place-items:center;overflow:hidden;color:var(--muted);font-size:11px;flex-shrink:0}
.thumb img{width:100%;height:100%;object-fit:cover}
.lbl{font-weight:600;font-size:13px;margin-bottom:4px;display:block}
.sticky{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:18px 0 4px;display:flex;gap:10px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.mitem{background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer;text-align:left;padding:0}
.mitem .thumb{width:100%;height:100px;border:0;border-radius:0}
.mitem div{padding:8px 10px;font-size:12px;word-break:break-all}
.modal{position:fixed;inset:0;background:rgba(11,37,69,.55);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal.on{display:flex}
.mbox{background:#fff;border-radius:16px;padding:20px;width:min(760px,100%);max-height:88vh;overflow:auto}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:10px;z-index:200;display:none;max-width:90vw}
code{background:#eef3f8;padding:1px 6px;border-radius:5px;font-size:12px}
@media(max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:-260px;width:250px;z-index:60;transition:left .2s}
  .side.on{left:0}
  .burger{display:block}
  .content{padding:16px}.top{padding:12px 16px}
  .grid2{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand"><i>LN</i><div>LearningNursing<small>Content admin</small></div></div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <div class="main">
    <div class="top">
      <button class="burger" id="burger" aria-label="Menu">☰</button>
      <h1 id="title">Dashboard</h1>
      <span class="dirty" id="dirtyTag" style="display:none"></span>
      <a class="btn" href="../" target="_blank" rel="noopener">View site</a>
      <button class="btn pri" id="saveAll">Publish changes</button>
    </div>
    <div class="content" id="main">Loading…</div>
  </div>
</div>

<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   LearningNursing ADMIN
   ---------------------------------------------------------
   • Reads  /content/*.json  (the single source of truth)
   • Edits them in memory
   • "Publish changes" sends them to your Cloudflare Worker,
     which commits them to GitHub (token never in this file)
   • "Import from current website" fills everything from your
     existing index.html the first time, so nothing is lost
   ========================================================= */
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const slug=s=>String(s).toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const getP=(o,p)=>p.split('.').reduce((a,k)=>a==null?a:a[k],o);
const setP=(o,p,v)=>{const k=p.split('.'),l=k.pop();k.reduce((a,x)=>a[x],o)[l]=v;};
const today=()=>new Date().toISOString().slice(0,10);

/* ---------- data ---------- */
const FILES={procedures:'content/procedures.json',notes:'content/notes.json',videos:'content/videos.json',resources:'content/resources.json',site:'content/site.json',media:'content/media.json'};
const DB={procedures:{categories:[],items:[]},notes:{items:[]},videos:{items:[]},resources:{modules:[],trending:[]},site:{text:[],images:[]},media:{items:[]}};
const DIRTY=new Set(), LOADED={};
let view='dashboard', EDIT=null, PICK=null; const UI={};
const cfg={get url(){return (localStorage.getItem('ln_worker')||'').replace(/\/$/,'')},get pw(){return sessionStorage.getItem('ln_pw')||''}};
const ART=['hands','rub','soap','bp','thermometer','pulse','lungs','bed','medicine','injection'];
const DEFAULT_PRECAUTIONS=['Follow current institutional guidance.','Confirm patient-specific requirements.','Use appropriate infection-prevention measures.','Escalate unexpected or concerning findings through the appropriate clinical pathway.'];

/* Website-text registry: label, group, CSS selector, optional attribute.
   To make a NEW piece of text editable later, add a line here (or use
   "Add custom field" inside the Website Text screen — no code needed). */
const TEXT_DEFAULTS=[
['Browser tab title','Site & SEO','title'],
['Search-engine description','Site & SEO','meta[name="description"]','content'],
['Menu: Home','Navigation','.nav-links button:nth-child(1)'],
['Menu: Categories','Navigation','.nav-links button:nth-child(2)'],
['Menu: Procedures','Navigation','.nav-links button:nth-child(3)'],
['Menu: Modules','Navigation','.nav-links button:nth-child(4)'],
['Menu: Trending','Navigation','.nav-links button:nth-child(5)'],
['Menu: Resources','Navigation','.nav-links button:nth-child(6)'],
['Top search placeholder','Navigation','#navSearch','placeholder'],
['Hero small label','Hero','.hero .eyebrow'],
['Hero title (HTML allowed: <br>, <span>)','Hero','.hero h1'],
['Hero subtitle','Hero','.hero p'],
['Hero search placeholder','Hero','#heroSearch','placeholder'],
['Hero button: Search','Hero','.hero-search .primary-btn'],
['Hero button: Explore','Hero','.hero-actions .primary-btn'],
['Hero button: Browse','Hero','.hero-actions .secondary-btn'],
['Stat 1 number','Stats','.stats .stat:nth-child(1) strong'],['Stat 1 label','Stats','.stats .stat:nth-child(1) span'],
['Stat 2 number','Stats','.stats .stat:nth-child(2) strong'],['Stat 2 label','Stats','.stats .stat:nth-child(2) span'],
['Stat 3 number','Stats','.stats .stat:nth-child(3) strong'],['Stat 3 label','Stats','.stats .stat:nth-child(3) span'],
['Stat 4 number','Stats','.stats .stat:nth-child(4) strong'],['Stat 4 label','Stats','.stats .stat:nth-child(4) span'],
['Categories heading','Section headings','#categories .section-heading h2'],['Categories description','Section headings','#categories .section-heading p'],
['Procedures heading','Section headings','#procedures .section-heading h2'],['Procedures description','Section headings','#procedures .section-heading p'],
['Modules heading','Section headings','#learning-modules .section-heading h2'],['Modules description','Section headings','#learning-modules .section-heading p'],
['Trending heading','Section headings','#trending .section-heading h2'],['Trending description','Section headings','#trending .section-heading p'],
['Notes heading','Section headings','#resources .section-heading h2'],['Notes description','Section headings','#resources .section-heading p'],
['Feature panel heading','About / Feature','.feature-panel h2'],['Feature panel text','About / Feature','.feature-panel > div:first-child > p'],
['Creator label','About / Creator','.creator-label'],['Creator name','About / Creator','.creator-info h2'],['Creator role','About / Creator','.creator-role'],
['Creator message','About / Creator','.creator-message'],['Creator email (shown text)','About / Creator','.creator-email'],['Creator quote','About / Creator','.creator-quote'],
['Footer description','Footer','.footer-brand p'],['Footer copyright line','Footer','.footer-bottom'],
];
/* Image slots: label, selector, how to apply (src | bg | favicon), current default */
const IMAGE_DEFAULTS=[
['Hero image','.hero-art img','src'],
['Website background (blurred, behind everything)','body','bg'],
['Creator photo','.creator-photo','src'],
['Nurse Callie calculator button','#nurseCallieButton img','src'],
['Favicon (browser tab icon)','link[rel~="icon"]','favicon'],
];

const SPECS={
 procedures:{label:'procedure',plural:'Procedures',file:'procedures',id:true,arr:()=>DB.procedures.items,
  name:o=>o.title,sub:o=>`${o.categoryName||''} · ${o.difficulty||''} · ${(o.steps||[]).length} steps`,
  filter:{label:'All categories',get:o=>o.category,opts:()=>DB.procedures.categories.map(c=>[c.id,c.name])},
  blank:()=>({id:'',title:'',category:DB.procedures.categories[0]?.id||'',categoryName:'',difficulty:'Beginner',description:'',keywords:[],illustration:'',overview:'',why:'',indications:[],contraindications:[],equipment:[],precautions:[...DEFAULT_PRECAUTIONS],steps:[],images:[],videos:[],references:[],lastReviewed:'',author:'',seo:{title:'',description:''},published:true,featured:false}),
  form:()=>procForm()},
 notes:{label:'note',plural:'Notes',file:'notes',id:true,arr:()=>DB.notes.items,
  name:o=>o.title,sub:o=>`${(o.topics||[]).length} topic groups · ${(o.blocks||[]).length} content blocks`,
  blank:()=>({id:'',title:'',icon:'📚',description:'',subject:'',topics:[],blocks:[],references:[],published:true,author:'',updated:''}),
  form:()=>noteForm()},
 videos:{label:'video',plural:'Videos',file:'videos',id:true,arr:()=>DB.videos.items,
  name:o=>o.title,sub:o=>o.src,
  blank:()=>({id:'',title:'',description:'',src:'',poster:'',autoplay:false,muted:true,loop:false,controls:true,featured:false,published:true}),
  fields:[{l:'Title',k:'title'},{l:'Description',k:'description',type:'area'},{l:'Video file path or URL',k:'src',type:'media',hint:'Exact file name and capital letters matter on GitHub Pages, e.g. nursingvideo.MP4. Direct video files only (not YouTube links).'},
   {l:'Thumbnail / poster image',k:'poster',type:'img'},{l:'Autoplay',k:'autoplay',type:'check'},{l:'Muted (needed for autoplay)',k:'muted',type:'check'},{l:'Loop',k:'loop',type:'check'},{l:'Show player controls',k:'controls',type:'check'},
   {l:'Use as the big video at the top of the home page',k:'featured',type:'check'},{l:'Published',k:'published',type:'check'}]},
 modules:{label:'learning module',plural:'Learning modules',file:'resources',arr:()=>DB.resources.modules,
  name:o=>o.title,sub:o=>o.description,blank:()=>({icon:'📘',title:'',description:'',cta:'Explore →',published:true}),
  fields:[{l:'Icon (emoji)',k:'icon'},{l:'Title',k:'title'},{l:'Description',k:'description',type:'area'},{l:'Link text',k:'cta'},{l:'Published',k:'published',type:'check'}]},
 trending:{label:'trending skill',plural:'Trending skills',file:'resources',arr:()=>DB.resources.trending,
  name:o=>o.title,sub:o=>'Opens: '+o.procedureId,blank:()=>({title:'',description:'',procedureId:'',label:'Open Guide →',published:true}),
  fields:[{l:'Title',k:'title'},{l:'Description',k:'description',type:'area'},{l:'Procedure it opens',k:'procedureId',type:'select',opts:()=>DB.procedures.items.map(p=>[p.id,p.title])},{l:'Button text',k:'label'},{l:'Published',k:'published',type:'check'}]},
 categories:{label:'category',plural:'Categories',file:'procedures',idEdit:true,arr:()=>DB.procedures.categories,
  name:o=>o.name,sub:o=>`${o.card?'Card':''} ${o.filter?'· Filter button':''}`,blank:()=>({id:'',name:'',icon:'📋',blurb:'',filterLabel:'',card:true,filter:false}),
  fields:[{l:'Name',k:'name'},{l:'Identifier (lowercase, no spaces)',k:'id',hint:'Used by procedures. Do not change after procedures use it.'},{l:'Icon (emoji)',k:'icon'},{l:'Short description (on the category card)',k:'blurb'},
   {l:'Show as a card in "Explore Nursing Categories"',k:'card',type:'check'},{l:'Show as a filter button above procedures',k:'filter',type:'check'},{l:'Filter button label (optional, shorter)',k:'filterLabel'}]},
};
const TPL={step:{title:'',instruction:'',explanation:'',art:''},equip:['',''],ref:{title:'',url:''},topic:{title:'',items:[]},
 b_heading:{type:'heading',text:''},b_paragraph:{type:'paragraph',text:''},b_bullets:{type:'bullets',items:[]},b_table:{type:'table',rows:''},b_image:{type:'image',src:'',caption:''},b_link:{type:'link',text:'',url:''},
 pimg:{src:'',caption:''},pvid:{src:'',title:'',poster:''}};

/* ---------- helpers ---------- */
const mediaUrl=p=>!p?'':(/^(https?:)?\/\/|^data:/.test(p)?p:'../'+p.replace(/^\//,''));
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',3200);}
function dirty(k){DIRTY.add(k);updateTag();}
function updateTag(){const t=$('#dirtyTag');t.style.display=DIRTY.size?'':'none';t.textContent=DIRTY.size+' unpublished change'+(DIRTY.size>1?'s':'');}
function download(name,obj){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}));a.download=name;a.click();}

/* ---------- load ---------- */
async function loadAll(){
  for(const [k,f] of Object.entries(FILES)){
    try{const r=await fetch('../'+f+'?t='+Date.now());if(!r.ok)throw 0;DB[k]=await r.json();LOADED[k]=true;}catch{LOADED[k]=false;}
  }
  if(!LOADED.site) DB.site={text:TEXT_DEFAULTS.map(([label,group,selector,attr])=>({label,group,selector,attr:attr||'',value:''})),images:IMAGE_DEFAULTS.map(([label,selector,attr])=>({label,selector,attr,value:''}))};
  render();
}

/* ---------- IMPORT from existing index.html (one-time, non-destructive) ---------- */
async function importFromSite(){
  if(LOADED.procedures&&!confirm('Content already exists. Importing will REPLACE what is in this admin with the content currently inside index.html. Continue?'))return;
  try{
    const html=await (await fetch('../index.html?t='+Date.now())).text();
    const doc=new DOMParser().parseFromString(html,'text/html');
    const a=html.indexOf('const procedures ='),b=html.indexOf('SVG ILLUSTRATION ENGINE');
    if(a<0||b<0)throw new Error('Could not find the procedures array in index.html (it may already have been moved).');
    let seg=html.slice(a,b);seg=seg.slice(seg.indexOf('=')+1,seg.lastIndexOf('];')+1);
    const arr=new Function('return '+seg)();   // your own site's data, same origin
    /* Normalise every procedure to the Hand Hygiene structure; keep all existing content */
    const norm=p=>({id:p.id,title:p.title,category:p.category,categoryName:p.categoryName,difficulty:p.difficulty||'Beginner',description:p.description||'',keywords:p.keywords||[],illustration:p.illustration||'',overview:p.overview||'',why:p.why||'',
      indications:p.indications||[],contraindications:p.contraindications||[],equipment:(p.equipment||[]).map(x=>[x[0]||'',x[1]||'']),precautions:p.precautions||[...DEFAULT_PRECAUTIONS],
      steps:(p.steps||[]).map(s=>({title:s.title||'',instruction:s.instruction||'',explanation:s.explanation||'',art:s.art||''})),images:p.images||[],videos:p.videos||[],
      references:(p.references||[]).map(r=>({title:r.title||'',url:r.url||''})),lastReviewed:p.lastReviewed||'',author:p.author||'',seo:p.seo||{title:'',description:''},published:p.published!==false,featured:!!p.featured});
    const items=arr.map(norm);
    /* categories (cards + filter buttons) */
    const fb={};doc.querySelectorAll('.procedure-toolbar .filter-btn').forEach(x=>{const m=(x.getAttribute('onclick')||'').match(/'([^']+)'/);if(m&&m[1]!=='all')fb[m[1]]=x.textContent.trim();});
    const cats=[];doc.querySelectorAll('.category-card').forEach(x=>{const m=(x.getAttribute('onclick')||'').match(/'([^']+)'/);if(!m)return;
      cats.push({id:m[1],name:x.querySelector('h3').textContent.trim(),icon:x.querySelector('.category-icon').textContent.trim(),blurb:x.querySelector('p').textContent.trim(),filterLabel:fb[m[1]]||'',card:true,filter:!!fb[m[1]]});});
    items.forEach(p=>{if(!cats.find(c=>c.id===p.category))cats.push({id:p.category,name:p.categoryName,icon:'📋',blurb:'',filterLabel:'',card:false,filter:false});});
    DB.procedures={categories:cats,items};
    /* notes (existing accordion cards) */
    const notes=[];doc.querySelectorAll('.notes-card').forEach(x=>{
      const topics=[];const sub=x.querySelector('.subtopics');
      if(sub)[...sub.children].forEach(ch=>{
        if(ch.tagName==='DETAILS')topics.push({title:ch.querySelector('summary').textContent.trim(),items:[...ch.querySelectorAll('li')].map(l=>l.textContent.trim())});
        else if(ch.tagName==='UL')topics.push({title:'',items:[...ch.querySelectorAll('li')].map(l=>l.textContent.trim())});});
      const t=x.querySelector('h3').textContent.trim();
      notes.push({id:slug(t),title:t,icon:x.querySelector('.notes-icon').textContent.trim(),description:(x.querySelector(':scope > p')||{textContent:''}).textContent.trim(),subject:t,topics,blocks:[],references:[],published:true,author:'',updated:''});});
    DB.notes={items:notes};
    /* resources */
    DB.resources={modules:[...doc.querySelectorAll('.learning-module')].map(x=>({icon:x.querySelector('.module-icon').textContent.trim(),title:x.querySelector('h3').textContent.trim(),description:x.querySelector('p').textContent.trim(),cta:(x.querySelector('.module-pop')||{textContent:''}).textContent.trim(),published:true})),
      trending:[...doc.querySelectorAll('.trending-card')].map(x=>({title:x.querySelector('h3').textContent.trim(),description:x.querySelector('p').textContent.trim(),procedureId:((x.querySelector('button').getAttribute('onclick')||'').match(/'([^']+)'/)||[])[1]||'',label:x.querySelector('button').textContent.trim(),published:true}))};
    /* main video */
    const v=doc.querySelector('#nursingVideo');
    DB.videos={items:v?[{id:'main-video',title:(doc.querySelector('.video-overlay-content h2')||{textContent:''}).textContent.trim(),description:(doc.querySelector('.video-overlay-content p')||{textContent:''}).textContent.trim(),src:v.querySelector('source').getAttribute('src'),poster:v.getAttribute('poster')||'',autoplay:v.hasAttribute('autoplay'),muted:v.hasAttribute('muted'),loop:v.hasAttribute('loop'),controls:v.hasAttribute('controls'),featured:true,published:true}]:[]};
    /* website text + image slots: read current values from the live markup */
    DB.site={text:TEXT_DEFAULTS.map(([label,group,selector,attr])=>{const el=selector==='title'?doc.querySelector('title'):doc.querySelector(selector);
        const value=!el?'':attr?(el.getAttribute(attr)||''):el.innerHTML.replace(/\s+/g,' ').trim();return{label,group,selector,attr:attr||'',value};}),
      images:IMAGE_DEFAULTS.map(([label,selector,attr])=>{let value='';if(attr==='bg')value='nursing-background.JPG';else{const el=doc.querySelector(selector);if(el)value=el.getAttribute(attr==='favicon'?'href':'src')||'';}return{label,selector,attr,value};})};
    /* media library: every image/video path found */
    const seen=new Set(),mi=[];const add=(p,l)=>{if(p&&!seen.has(p)&&!/^https?:/.test(p)){seen.add(p);mi.push({path:p,label:l||p.split('/').pop()});}};
    items.forEach(p=>{add(p.illustration,p.title);p.steps.forEach(s=>/\.(jpe?g|png|webp|gif|svg)$/i.test(s.art)&&add(s.art));});
    DB.site.images.forEach(i=>add(i.value,i.label));DB.videos.items.forEach(x=>{add(x.src,x.title);add(x.poster);});
    DB.media={items:mi};
    Object.keys(FILES).forEach(k=>{LOADED[k]=true;dirty(k);});
    toast('Imported '+items.length+' procedures, '+notes.length+' notes. Review, then press Publish changes.');render();
  }catch(err){alert('Import failed: '+err.message);}
}

/* ---------- publish ---------- */
async function api(path,body){
  if(!cfg.url||!cfg.pw)throw new Error('Open Settings and enter your Worker URL and password first.');
  const r=await fetch(cfg.url+path,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+cfg.pw},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('Server error '+r.status));return j;
}
async function saveAll(){
  if(!DIRTY.size)return toast('Nothing to publish.');
  if(!cfg.url||!cfg.pw){go('settings');return toast('Enter Worker URL and password first.');}
  const btn=$('#saveAll');btn.disabled=true;btn.textContent='Publishing…';
  try{for(const k of [...DIRTY]){await api('/api/save',{path:FILES[k],json:DB[k]});DIRTY.delete(k);updateTag();}
    toast('Published. The live site updates in 1–2 minutes (GitHub Pages rebuild).');}
  catch(err){alert('Publish failed: '+err.message);}
  btn.disabled=false;btn.textContent='Publish changes';
}

function saveEdit(){
  const {kind,idx,obj}=EDIT,S=SPECS[kind],arr=S.arr();
  if(!String(S.name(obj)||'').trim())return toast('Please enter a title first.');
  if(S.id&&!obj.id)obj.id=slug(S.name(obj));
  if(kind==='categories'){obj.id=slug(obj.id||obj.name);if(!obj.id)return toast('Enter an identifier.');}
  if((S.id||kind==='categories')&&arr.some((x,i)=>x.id===obj.id&&i!==idx))return toast('Another item already uses the identifier "'+obj.id+'". Change the title or identifier.');
  if(kind==='procedures'){const c=DB.procedures.categories.find(c=>c.id===obj.category);obj.categoryName=c?c.name:obj.category;}
  if(kind==='categories')DB.procedures.items.forEach(p=>{if(p.category===obj.id)p.categoryName=obj.name;});
  if(kind==='notes')obj.updated=obj.updated||today();
  if(kind==='videos'&&obj.featured)arr.forEach(v=>v.featured=false);
  idx===null?arr.push(obj):arr[idx]=obj;
  dirty(S.file);EDIT=null;if(kind==='categories')view='categories';render();toast('Saved. Press Publish changes when ready.');
}

  const inp=document.createElement('input');inp.type='file';inp.accept='image/*,video/mp4,video/webm';
  inp.onchange=async()=>{const f=inp.files[0];if(!f)return;
    if(!cfg.url||!cfg.pw){alert('Set the Worker URL and password in Settings before uploading.');return;}
    const name=f.name.replace(/[^A-Za-z0-9._-]/g,'-');const dir=f.type.startsWith('video')?'videos':'images';
    if(f.size>25*1024*1024&&!confirm('This file is large ('+Math.round(f.size/1048576)+' MB). Upload anyway?'))return;
    toast('Uploading '+name+'…');
    try{const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(f);});
      await api('/api/upload',{path:dir+'/'+name,base64:b64});
      const p=dir+'/'+name;if(!DB.media.items.find(x=>x.path===p)){DB.media.items.push({path:p,label:name});dirty('media');}
      toast('Uploaded '+p+' (live in 1–2 minutes).');
      if(PICK&&$('#modal').classList.contains('on'))choose(p);else render();
    }catch(err){alert('Upload failed: '+err.message);}};
  inp.click();
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const d=b.dataset,a=d.act,k=d.k,i=+d.i;
  const arr=()=>SPECS[k].arr();
  switch(a){
   case 'go':go(d.v);break;
   case 'import':importFromSite();break;
   case 'new':if(!LOADED.procedures&&k==='procedures'&&!DB.procedures.categories.length)toast('Tip: import your current website first so categories exist.');openEdit(k,null);break;
   case 'edit':openEdit(k,i);break;
   case 'cancel':EDIT=null;render();break;
   case 'saveedit':saveEdit();break;
   case 'dup':{const o=clone(arr()[i]);if(o.id)o.id=o.id+'-copy-'+Date.now().toString(36).slice(-3);if(o.title)o.title+=' (copy)';if(o.name)o.name+=' (copy)';if(o.published!==undefined)o.published=false;arr().splice(i+1,0,o);dirty(SPECS[k].file);render();toast('Duplicated as a draft.');break;}
   case 'tog':arr()[i].published=arr()[i].published===false;dirty(SPECS[k].file);render();break;
   case 'del':if(k==='categories'&&DB.procedures.items.some(p=>p.category===arr()[i].id))return alert('Procedures still use this category. Move them first.');
     if(confirm('Delete "'+(SPECS[k].name(arr()[i])||'item')+'"? (Unpublish instead if you may need it later.)')){arr().splice(i,1);dirty(SPECS[k].file);render();}break;
   case 'mv':{const j=i+ +d.d;if(j<0||j>=arr().length)break;[arr()[i],arr()[j]]=[arr()[j],arr()[i]];dirty(SPECS[k].file);render();break;}
   case 'radd':{const t=getP(EDIT.obj,d.path);t.push(clone(TPL[d.tpl]));render();break;}
   case 'rdel':getP(EDIT.obj,d.path).splice(i,1);render();break;
   case 'rmv':{const t=getP(EDIT.obj,d.path),j=i+ +d.d;if(j<0||j>=t.length)break;[t[i],t[j]]=[t[j],t[i]];render();break;}
   case 'pick':PICK={path:d.path,isdb:!!d.isdb};openPicker();break;
   case 'choose':choose(d.p);break;
   case 'closemodal':$('#modal').classList.remove('on');break;
   case 'upload':uploadFlow();break;
   case 'mdel':if(confirm('Remove from the library list? (The file stays in GitHub.)')){DB.media.items.splice(i,1);dirty('media');render();}break;
   case 'addtext':{const l=$('#ntl').value.trim(),s=$('#nts').value.trim();if(!l||!s)return toast('Enter a label and selector.');DB.site.text.push({label:l,group:'Custom',selector:s,attr:'',value:''});dirty('site');render();break;}
   case 'addimg':{const l=$('#nil').value.trim(),s=$('#nis').value.trim();if(!l||!s)return toast('Enter a label and selector.');DB.site.images.push({label:l,selector:s,attr:'src',value:''});dirty('site');render();break;}
   case 'savecfg':{localStorage.setItem('ln_worker',$('#wurl').value.trim());sessionStorage.setItem('ln_pw',$('#wpw').value);
     api('/api/ping',{}).then(()=>toast('Connected.')).catch(err=>alert('Could not connect: '+err.message));break;}
   case 'exportall':Object.keys(FILES).forEach(x=>download(x+'.json',DB[x]));break;
  }
});
/* typing in editor fields / site fields updates the data immediately (no re-render, so focus is kept) */
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.ui){const k=t.dataset.ui;UI[k]=t.value;
    if(k==='tq')$('#tlist').innerHTML=textList();else{const kind=k.slice(0,-1);$('#rows-'+kind).innerHTML=rowsHtml(kind);}return;}
  if(t.dataset.db){setP(DB,t.dataset.db,t.value);dirty(t.dataset.db.split('.')[0]);return;}
  if(!t.dataset.f||!EDIT)return;
  let v=t.type==='checkbox'?t.checked:t.value;
  if(t.dataset.t==='lines')v=v.split('\n').map(s=>s.trim()).filter(Boolean);
  if(t.dataset.t==='csv')v=v.split(',').map(s=>s.trim()).filter(Boolean);
  setP(EDIT.obj,t.dataset.f,v);
});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.ui&&t.tagName==='SELECT'){UI[t.dataset.ui]=t.value;const kd=t.dataset.ui.slice(0,-1);$('#rows-'+kd).innerHTML=rowsHtml(kd);}
  const th=t.closest&&t.closest('.imgf');if(th)th.querySelector('.thumb').innerHTML=thumb(t.value);});   // refresh thumbnail only
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')$('#modal').classList.remove('on');});

loadAll();
</script>
